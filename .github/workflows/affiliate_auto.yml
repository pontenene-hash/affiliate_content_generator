
name: Affiliate Auto Generator

on:
  schedule:
    # 日本時間 毎月5日・15日・25日 午前9時
    - cron: '0 0 5,15,25 * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テストのみ（WordPressには保存しない）'
        required: true
        type: boolean
        default: true

      test_gemini:
        description: 'Gemini接続テストを実行する'
        required: true
        type: boolean
        default: true

# GitHub記事履歴の読み書きに必要
permissions:
  contents: write

concurrency:
  group: affiliate-auto-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile auto_pipeline.py
          python -m py_compile auto_creative.py
          python -m py_compile social_tools.py
          python -m py_compile article_history.py
          python -m py_compile product_registry.py

      - name: Check registered products
        env:
          GITHUB_TOKEN: ${{ secrets.AFFILIATE_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from product_registry import read_items

          items = read_items()

          print('Registered products:', len(items))
          print(
              'Enabled products:',
              sum(bool(x.get('enabled', True)) for x in items)
          )
          PY

      # Gemini connection test
      # Runs only when requested manually.
      # Does not create WordPress drafts.
      - name: Test Gemini connection
        if: github.event_name == 'workflow_dispatch' && inputs.test_gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from auto_pipeline import llm, gemini_model

          model = gemini_model()

          print(
              'Testing Gemini model:',
              model,
              flush=True
          )

          result = llm(
              '接続確認です。「接続成功」とだけ日本語で回答してください。',
              max_tokens=100
          )

          print(
              'Gemini response:',
              result,
              flush=True
          )

          print(
              'Gemini connection test passed.',
              flush=True
          )
          PY

      # Article generation
      # Manual run: maximum 1 article
      # Scheduled run: maximum 5 articles
      - name: Generate affiliate drafts and creative prompts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

          # Existing product registry authentication
          GITHUB_TOKEN: ${{ secrets.AFFILIATE_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # GitHub article history authentication
          GH_HISTORY_TOKEN: ${{ github.token }}
          GITHUB_BRANCH: ${{ github.ref_name }}

          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          from auto_pipeline import run_batch

          dry_run = (
              os.environ.get(
                  'DRY_RUN',
                  'false'
              ).lower() == 'true'
          )

          event_name = os.environ.get(
              'GITHUB_EVENT_NAME',
              ''
          )

          # Limit manual tests to one article.
          # Keep scheduled production at five articles.
          limit = (
              1 if event_name == 'workflow_dispatch'
              else 5
          )

          print(
              'GitHub event:',
              event_name,
              flush=True
          )

          print(
              'Dry run:',
              dry_run,
              flush=True
          )

          print(
              'Article limit:',
              limit,
              flush=True
          )

          result = run_batch(
              limit=limit,
              dry_run=dry_run
          )

          print(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              flush=True
          )

          with open(
              'affiliate_run_report.json',
              'w',
              encoding='utf-8'
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          errors = [
              item
              for item in result.get('results', [])
              if (
                  item.get('status') in (
                      'error',
                      'manual_link_required'
                  )
                  or str(
                      item.get('creative', '')
                  ).startswith('error:')
              )
          ]

          if errors:
              print(
                  'ERROR: Article or creative generation failed.',
                  file=sys.stderr
              )
              sys.exit(1)

          print(
              'Completed articles:',
              result.get('processed', 0),
              flush=True
          )

          if dry_run:
              print(
                  'Test completed. '
                  'No WordPress draft was created.',
                  flush=True
              )
          PY

      # Upload execution report
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-run-report-${{ github.run_number }}
          path: affiliate_run_report.json
          retention-days: 30
          if-no-files-found: ignore

      # Upload blog, SNS, image and video prompts
      - name: Upload creative prompt files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-creative-prompts-${{ github.run_number }}
          path: creative_outputs/
          retention-days: 30
          if-no-files-found: ignore
