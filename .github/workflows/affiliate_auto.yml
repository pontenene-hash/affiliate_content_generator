
name: Affiliate Auto Generator

on:
  schedule:
    # 日本時間 毎月5日・15日・25日 午前9時
    - cron: '0 0 5,15,25 * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テストのみ（WordPressには保存しない）'
        required: true
        type: boolean
        default: true
      test_gemini:
        description: 'Gemini接続テストを実行する'
        required: true
        type: boolean
        default: true
      regenerate_creative:
        description: '保存済み記事の制作プロンプトのみ再生成（記事は新規作成しない）'
        required: true
        type: boolean
        default: false
      existing_post_id:
        description: '再生成するWordPress記事ID（例：1025）'
        required: false
        type: string
        default: ''
      safe_patch_check:
        description: '従来のSNS安全修正を確認（記事生成なし）'
        required: true
        type: boolean
        default: false
      apply_safe_patch:
        description: '従来のSNS安全修正を保存（safe_patch_checkもオン）'
        required: true
        type: boolean
        default: false
      social_json_fix_check:
        description: 'SNS JSON修正を安全確認（記事生成なし）'
        required: true
        type: boolean
        default: false
      apply_social_json_fix:
        description: 'SNS JSON修正を保存（social_json_fix_checkもオン）'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: affiliate-auto-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate patch selection
        if: github.event_name == 'workflow_dispatch'
        env:
          SAFE_PATCH_CHECK: ${{ inputs.safe_patch_check }}
          APPLY_SAFE_PATCH: ${{ inputs.apply_safe_patch }}
          JSON_FIX_CHECK: ${{ inputs.social_json_fix_check }}
          APPLY_JSON_FIX: ${{ inputs.apply_social_json_fix }}
          REGENERATE_CREATIVE: ${{ inputs.regenerate_creative }}
        run: |
          python - <<'PY'
          import os

          enabled = lambda key: os.environ.get(key, '').lower() == 'true'
          safe_check = enabled('SAFE_PATCH_CHECK')
          safe_apply = enabled('APPLY_SAFE_PATCH')
          json_check = enabled('JSON_FIX_CHECK')
          json_apply = enabled('APPLY_JSON_FIX')
          regen = enabled('REGENERATE_CREATIVE')

          if safe_apply and not safe_check:
              raise SystemExit('apply_safe_patch requires safe_patch_check=true')
          if json_apply and not json_check:
              raise SystemExit('apply_social_json_fix requires social_json_fix_check=true')
          if safe_check and json_check:
              raise SystemExit('Select only one patch mode at a time')
          if (safe_check or json_check) and regen:
              raise SystemExit('Do not combine patch mode with regenerate_creative')

          print('Patch selection validated.')
          PY

      - name: Check safe patch on temporary copy
        if: github.event_name == 'workflow_dispatch' && inputs.safe_patch_check
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import subprocess
          import sys
          import tempfile

          source = pathlib.Path('social_tools.py')
          patch = pathlib.Path('social_tools_safe_patch.py')

          if not source.is_file() or not patch.is_file():
              raise SystemExit(
                  'Required social_tools.py or social_tools_safe_patch.py is missing'
              )

          original = source.read_text(encoding='utf-8')

          def function_names(code):
              return [
                  node.name
                  for node in ast.parse(code).body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              ]

          original_names = function_names(original)

          with tempfile.TemporaryDirectory() as folder:
              target = pathlib.Path(folder) / 'social_tools.py'
              target.write_text(original, encoding='utf-8')

              subprocess.run(
                  [sys.executable, str(patch.resolve()), str(target)],
                  check=True
              )

              updated = target.read_text(encoding='utf-8')
              updated_names = function_names(updated)

              approved_new_functions = {
                  '_strip_affiliate_link',
                  '_build_creative_prompts_original',
              }

              if len(updated_names) != len(set(updated_names)):
                  raise SystemExit(
                      'Duplicate function names detected; refusing patch'
                  )

              unexpected = [
                  name for name in updated_names
                  if name not in original_names
                  and name not in approved_new_functions
              ]

              if unexpected:
                  raise SystemExit(
                      'Unexpected new functions: ' + ', '.join(unexpected)
                  )

              preserved_order = [
                  name for name in updated_names
                  if name in original_names
              ]

              if preserved_order != original_names:
                  raise SystemExit(
                      'Existing functions removed or reordered; refusing patch'
                  )

              backup = target.with_suffix('.py.bak')

              if updated != original:
                  if not backup.is_file():
                      raise SystemExit('Backup file is missing')
                  if backup.read_text(encoding='utf-8') != original:
                      raise SystemExit('Backup differs from original')

              compile(updated, str(target), 'exec')
              print('Safe patch dry validation passed.')
          PY

      - name: Apply safe patch and commit to feature branch
        if: github.event_name == 'workflow_dispatch' && inputs.safe_patch_check && inputs.apply_safe_patch
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$GH_REF_NAME" != 'feature-affiliate-sns' ]; then
            echo 'Patch can only be committed on feature-affiliate-sns' >&2
            exit 1
          fi

          python social_tools_safe_patch.py social_tools.py
          python -m py_compile social_tools.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- social_tools.py

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Safely normalize affiliate SNS links'
            git push origin "HEAD:${GH_REF_NAME}"
          fi

      - name: Check SNS JSON fix on temporary copy
        if: github.event_name == 'workflow_dispatch' && inputs.social_json_fix_check
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import subprocess
          import sys
          import tempfile

          source = pathlib.Path('social_tools.py')
          patch = pathlib.Path('apply_social_json_fix.py')

          if not source.is_file() or not patch.is_file():
              raise SystemExit(
                  'social_tools.py or apply_social_json_fix.py is missing'
              )

          original = source.read_text(encoding='utf-8')
          original_tree = ast.parse(original)

          def top_functions(tree):
              return [
                  node.name for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              ]

          before = top_functions(original_tree)

          if len(before) != len(set(before)) or before.count('generate_social_plan') != 1:
              raise SystemExit(
                  'Original social_tools.py has duplicate or missing functions'
              )

          with tempfile.TemporaryDirectory() as folder:
              target = pathlib.Path(folder) / 'social_tools.py'
              target.write_text(original, encoding='utf-8')

              subprocess.run(
                  [sys.executable, str(patch.resolve()), str(target)],
                  check=True
              )

              updated = target.read_text(encoding='utf-8')
              after = top_functions(ast.parse(updated))

              if len(after) != len(set(after)):
                  raise SystemExit('Duplicate functions after SNS JSON fix')

              if after.count('generate_social_plan') != 1:
                  raise SystemExit('generate_social_plan missing or duplicated')

              if any(name not in after for name in before):
                  raise SystemExit('An existing function was removed')

              if [name for name in after if name in before] != before:
                  raise SystemExit('Existing function order changed')

              if 'def save_bundle' in updated:
                  raise SystemExit(
                      'Unexpected bundle code in social_tools.py'
                  )

              if updated != original:
                  # Match the backup filename created by
                  # apply_social_json_fix.py.
                  backup = target.with_name(
                      target.name + '.before_json_fix.bak'
                  )

                  if not backup.is_file():
                      raise SystemExit(
                          'Backup file is missing: ' + str(backup)
                      )

                  if backup.read_text(encoding='utf-8') != original:
                      raise SystemExit(
                          'Backup differs from original'
                      )

              compile(updated, str(target), 'exec')

              print(
                  'SNS JSON fix dry validation passed; '
                  'repository not modified.'
              )
          PY

      - name: Apply SNS JSON fix and commit to feature branch
        if: github.event_name == 'workflow_dispatch' && inputs.social_json_fix_check && inputs.apply_social_json_fix
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$GH_REF_NAME" != 'feature-affiliate-sns' ]; then
            echo 'JSON fix can only be committed on feature-affiliate-sns' >&2
            exit 1
          fi

          python apply_social_json_fix.py social_tools.py
          python -m py_compile social_tools.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- social_tools.py

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Split Gemini SNS JSON generation into smaller requests'
            git push origin "HEAD:${GH_REF_NAME}"
          fi

      - name: Install dependencies
        if: github.event_name == 'schedule' || (!inputs.safe_patch_check && !inputs.social_json_fix_check)
        run: pip install -r requirements.txt

      - name: Check Python syntax
        if: github.event_name == 'schedule' || (!inputs.safe_patch_check && !inputs.social_json_fix_check)
        run: |
          python -m py_compile auto_pipeline.py
          python -m py_compile auto_creative.py
          python -m py_compile social_tools.py
          python -m py_compile article_history.py
          python -m py_compile product_registry.py
          python -m py_compile retry_creative.py

      - name: Check registered products
        if: github.event_name == 'schedule' || (!inputs.safe_patch_check && !inputs.social_json_fix_check)
        env:
          GITHUB_TOKEN: ${{ secrets.AFFILIATE_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from product_registry import read_items

          items = read_items()

          print('Registered products:', len(items))
          print(
              'Enabled products:',
              sum(bool(x.get('enabled', True)) for x in items)
          )
          PY

      - name: Test Gemini connection
        if: github.event_name == 'workflow_dispatch' && !inputs.safe_patch_check && !inputs.social_json_fix_check && inputs.test_gemini && !inputs.regenerate_creative
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from auto_pipeline import llm, gemini_model

          model = gemini_model()
          print('Testing Gemini model:', model, flush=True)

          result = llm(
              '接続確認です。「接続成功」とだけ日本語で回答してください。',
              max_tokens=100
          )

          print('Gemini response:', result, flush=True)
          print('Gemini connection test passed.', flush=True)
          PY

      - name: Regenerate creative prompts from existing WordPress draft
        if: github.event_name == 'workflow_dispatch' && !inputs.safe_patch_check && !inputs.social_json_fix_check && inputs.regenerate_creative
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.AFFILIATE_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_HISTORY_TOKEN: ${{ github.token }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          EXISTING_POST_ID: ${{ inputs.existing_post_id }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          post_id = os.environ.get(
              'EXISTING_POST_ID', ''
          ).strip()

          if not re.fullmatch(r'[1-9][0-9]*', post_id):
              raise SystemExit(
                  'A positive numeric WordPress post ID is required'
              )

          subprocess.run(
              [
                  'python',
                  'retry_creative.py',
                  '--post-id',
                  post_id
              ],
              check=True
          )
          PY

      - name: Generate affiliate drafts and creative prompts
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.safe_patch_check && !inputs.social_json_fix_check && !inputs.regenerate_creative)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.AFFILIATE_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_HISTORY_TOKEN: ${{ github.token }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from auto_pipeline import run_batch

          dry_run = (
              os.environ.get('DRY_RUN', 'false').lower()
              == 'true'
          )

          event_name = os.environ.get(
              'GITHUB_EVENT_NAME', ''
          )

          limit = (
              1 if event_name == 'workflow_dispatch'
              else 5
          )

          print('GitHub event:', event_name, flush=True)
          print('Dry run:', dry_run, flush=True)
          print('Article limit:', limit, flush=True)

          result = run_batch(
              limit=limit,
              dry_run=dry_run
          )

          print(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ),
              flush=True
          )

          with open(
              'affiliate_run_report.json',
              'w',
              encoding='utf-8'
          ) as f:
              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          errors = [
              item
              for item in result.get('results', [])
              if (
                  item.get('status')
                  in ('error', 'manual_link_required')
                  or str(
                      item.get('creative', '')
                  ).startswith('error:')
              )
          ]

          if errors:
              print(
                  'ERROR: Article or creative generation failed.',
                  file=sys.stderr
              )
              sys.exit(1)

          print(
              'Completed articles:',
              result.get('processed', 0),
              flush=True
          )

          if dry_run:
              print(
                  'Test completed. No WordPress draft was created.',
                  flush=True
              )
          PY

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-run-report-${{ github.run_number }}
          path: affiliate_run_report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload creative prompt files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-creative-prompts-${{ github.run_number }}
          path: creative_outputs/
          retention-days: 30
          if-no-files-found: ignore
