
name: Affiliate Auto Generator

on:
  schedule:
    # 日本時間 毎月5日・15日・25日 午前9時
    - cron: '0 0 5,15,25 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affiliate-auto-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check registered products
        env:
          GITHUB_TOKEN: ${{ secrets.AFFILIATE_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: pontenene-hash/affiliate_content_generator
        run: |
          python -c "from product_registry import read_items; items = read_items(); print('Registered products:', len(items)); print('Enabled products:', sum(bool(x.get('enabled', True)) for x in items))"

      - name: Generate affiliate drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.AFFILIATE_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: pontenene-hash/affiliate_content_generator
        run: python auto_pipeline.py --limit 5
