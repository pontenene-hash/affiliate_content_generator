
name: Affiliate Image Install

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "WordPress draft post ID"
        required: true
        default: "1006"
        type: string
      zip_file:
        description: "Image ZIP file in repository"
        required: true
        default: "nyogankensa_images_4.zip"
        type: string
      product_id:
        description: "Registered affiliate product ID"
        required: true
        default: "be2bfe82d8916e04"
        type: string

permissions:
  contents: read

jobs:
  install-images:
    name: Install images
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

      POST_ID: ${{ inputs.post_id }}
      ZIP_FILE: ${{ inputs.zip_file }}
      PRODUCT_ID: ${{ inputs.product_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          test -f image_workflow.py
          test -f data/affiliate_products.json
          test -f "$ZIP_FILE"

          echo "Required files found."

      - name: Validate images and WordPress draft
        shell: bash
        run: |
          set -euo pipefail

          python image_workflow.py install \
            --post-id "$POST_ID" \
            --zip "$ZIP_FILE" \
            --products "data/affiliate_products.json" \
            --product-id "$PRODUCT_ID"

      - name: Upload images to WordPress draft
        shell: bash
        run: |
          set -euo pipefail

          python image_workflow.py install \
            --post-id "$POST_ID" \
            --zip "$ZIP_FILE" \
            --products "data/affiliate_products.json" \
            --product-id "$PRODUCT_ID" \
            --apply

      - name: Completed
        run: |
          echo "Image installation completed."
          echo "Please verify images in WordPress."
