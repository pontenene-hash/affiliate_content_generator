name: Affiliate V2 Offline Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile and test without production credentials
        run: |
          python -m compileall -q -x '/(\.git|\.venv)/' .
          python -m pytest -q --junitxml=validation-results.xml
          python test_affiliate_quality_v5.py
          python test_quality_improvements.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-v2-validation-results
          path: validation-results.xml
          if-no-files-found: warn
