name: Affiliate V5 Quality Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: |
          python -m py_compile affiliate_quality_v5.py
          python -m py_compile auto_creative.py
          python -m py_compile test_quality_improvements.py
      - name: Run V5 regression tests
        run: python test_affiliate_quality_v5.py
      - name: Run improved quality tests
        run: python test_quality_improvements.py
      - name: Confirm no production writes
        run: |
          echo 'Tests use synthetic bundles only.'
          echo 'No WordPress calls, article generation, or scheduled runs.'
