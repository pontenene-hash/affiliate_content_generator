
name: Affiliate V5 Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile affiliate_quality_v5.py
          python -m py_compile install_affiliate_quality_v5.py
          python -m py_compile test_affiliate_quality_v5.py
          python -m py_compile test_quality_improvements.py
          python -m py_compile auto_creative.py

      - name: Run V5 quality tests
        run: |
          python test_affiliate_quality_v5.py
          python test_quality_improvements.py

      - name: Test installer on temporary copy
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile

          source = pathlib.Path("auto_creative.py")

          with tempfile.TemporaryDirectory() as folder:
              target = pathlib.Path(folder) / "auto_creative.py"
              target.write_bytes(source.read_bytes())

              original = target.read_bytes()

              subprocess.run(
                  [
                      sys.executable,
                      "install_affiliate_quality_v5.py",
                      str(target)
                  ],
                  check=True
              )

              updated = target.read_text(encoding="utf-8")
              assert "AFFILIATE_QUALITY_V5_HOOK" in updated

              backup = target.with_suffix(".py.v5.bak")

              if backup.exists():
                  assert backup.read_bytes() == original
              else:
                  assert (
                      "AFFILIATE_QUALITY_V5_HOOK"
                      in original.decode("utf-8")
                  )

              subprocess.run(
                  [
                      sys.executable,
                      "install_affiliate_quality_v5.py",
                      str(target)
                  ],
                  check=True
              )

              assert target.read_text(encoding="utf-8") == updated

              print("V5 installer safety test passed")
          PY

      - name: Verify V5 integration without API calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("auto_creative.py").read_text(
              encoding="utf-8"
          )
          tree = ast.parse(source)

          functions = [
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "build_bundle"
          ]

          assert len(functions) >= 1

          assert "AFFILIATE_QUALITY_V5_HOOK" in source
          assert "review_bundle" in source

          print("V5 integration source check passed")
          PY

      - name: Final safety confirmation
        run: |
          echo "V5 safety checks completed successfully."
          echo "No WordPress posts were created or modified."
          echo "No scheduled generation was executed."
          echo "No production files were modified."
