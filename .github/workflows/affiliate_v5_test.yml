
name: Affiliate V5 Safety Test

on:
  workflow_dispatch:
    inputs:
      preview_limit:
        description: "Number of real preview articles (1–5)"
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "1"
      run_live:
        description: "Run one real API preview after offline tests"
        type: boolean
        default: false
      save_checkpoint:
        description: "Save raw preview checkpoint (private repository only)"
        type: boolean
        default: false
      resume_run_id:
        description: "Optional previous validation run ID for checkpoint recovery"
        type: string
        default: ""
      preview_product:
        description: "Registered product name (blank = automatic)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  test-v5:
    if: github.ref == 'refs/heads/feature-affiliate-v2-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install V2 validation dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML

      - name: Check Python syntax
        run: |
          python -m py_compile affiliate_quality_v5.py
          python -m py_compile install_affiliate_quality_v5.py
          python -m py_compile test_affiliate_quality_v5.py
          python -m py_compile test_quality_improvements.py
          python -m py_compile auto_creative.py
          python -m py_compile affiliate_article_guard.py
          python -m py_compile test_affiliate_article_guard.py
          python -m py_compile auto_pipeline.py

      - name: Run V5 quality tests
        run: |
          python test_affiliate_quality_v5.py
          python test_quality_improvements.py

      - name: Run article safety tests
        run: |
          python test_affiliate_article_guard.py

      - name: Test installer on temporary copy
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile

          source = pathlib.Path("auto_creative.py")
          marker = "AFFILIATE_QUALITY_V5_HOOK"

          with tempfile.TemporaryDirectory() as folder:
              target = pathlib.Path(folder) / "auto_creative.py"
              original = source.read_bytes()
              target.write_bytes(original)

              if marker in original.decode("utf-8"):
                  result = subprocess.run(
                      [
                          sys.executable,
                          "install_affiliate_quality_v5.py",
                          str(target),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if result.returncode == 0:
                      assert target.read_bytes() == original
                  else:
                      assert (
                          "manual review required"
                          in (result.stdout + result.stderr)
                      )

                  assert target.read_bytes() == original
                  print("Existing V5 integration preserved.")
              else:
                  subprocess.run(
                      [
                          sys.executable,
                          "install_affiliate_quality_v5.py",
                          str(target),
                      ],
                      check=True,
                  )

                  updated = target.read_text(
                      encoding="utf-8"
                  )
                  assert marker in updated

                  backup = target.with_suffix(
                      ".py.v5.bak"
                  )
                  assert backup.exists()
                  assert backup.read_bytes() == original

                  subprocess.run(
                      [
                          sys.executable,
                          "install_affiliate_quality_v5.py",
                          str(target),
                      ],
                      check=True,
                  )

                  assert (
                      target.read_text(encoding="utf-8")
                      == updated
                  )

                  print("V5 installer safety test passed.")
          PY

      - name: Verify V5 integration without API calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("auto_creative.py").read_text(
              encoding="utf-8"
          )
          tree = ast.parse(source)

          functions = [
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "build_bundle"
          ]

          assert functions, (
              "build_bundle function is missing"
          )

          assert "AFFILIATE_QUALITY_V5_HOOK" in source, (
              "V5 quality hook is missing"
          )

          assert "review_bundle" in source, (
              "V5 review function is not referenced"
          )

          print("V5 integration check passed.")
          print("No Gemini API calls were made.")
          print("No WordPress requests were made.")
          PY

      - name: Verify article guard integration
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("auto_pipeline.py").read_text(
              encoding="utf-8"
          )

          assert "affiliate_article_guard" in source, (
              "Article safety guard is not integrated "
              "into auto_pipeline.py"
          )

          print("Article guard reference found.")
          print("No WordPress requests were made.")
          PY

      - name: Run V2 offline validation
        run: |
          python -m py_compile section_engine.py stage4_metadata.py auto_pipeline.py
          python -m pytest -q --junitxml=validation-results.xml

      - name: Upload V2 validation results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: affiliate-v2-validation-results
          path: validation-results.xml
          if-no-files-found: warn

      - name: Final safety confirmation
        run: |
          echo "All V5 safety tests passed."
          echo "V2 offline validation passed."
          echo "Article safety tests passed."
          echo "Quality improvement tests passed."
          echo "No production files were modified."
          echo "WordPress was not accessed."
          echo "Scheduled article generation was not executed."

  live-preview:
    if: github.ref == 'refs/heads/feature-affiliate-v2-validation' && inputs.run_live == true
    needs: test-v5
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Restore isolated preview checkpoint
        if: inputs.save_checkpoint == true && inputs.resume_run_id != '' && github.event.repository.private == true
        uses: actions/download-artifact@v5
        with:
          name: ponte-preview-checkpoint
          path: .ponte-preview-cache
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - run: mkdir -p .ponte-preview-cache
      - name: Generate article and creative previews without WordPress
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GH_HISTORY_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          PREVIEW_LIMIT: ${{ inputs.preview_limit }}
          PREVIEW_PRODUCT: ${{ inputs.preview_product }}
          PIPELINE_DB: /tmp/ponte-preview.sqlite3
          PONTE_REVIEW_STORAGE: ${{ inputs.save_checkpoint && github.event.repository.private && '.ponte-preview-cache/review.sqlite3' || '' }}
          PONTE_STORAGE_SCOPE: validation-preview
        run: python run_live_preview.py
      - name: Upload live preview results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: affiliate-v2-live-preview
          path: |
            preview_outputs/
            creative_outputs/post_*/
          if-no-files-found: warn

      - name: Save isolated preview checkpoint
        if: always() && inputs.save_checkpoint == true && github.event.repository.private == true
        uses: actions/upload-artifact@v5
        with:
          name: ponte-preview-checkpoint
          path: .ponte-preview-cache/review.sqlite3
          retention-days: 1
          if-no-files-found: ignore
