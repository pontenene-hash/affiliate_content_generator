
name: Affiliate V5 Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          python -m py_compile affiliate_quality_v5.py
          python -m py_compile install_affiliate_quality_v5.py
          python -m py_compile test_affiliate_quality_v5.py
          python -m py_compile test_quality_improvements.py
          python -m py_compile auto_creative.py

      - name: Run V5 quality tests
        run: |
          python test_affiliate_quality_v5.py
          python test_quality_improvements.py

      - name: Test installer on temporary copy
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile

          source = pathlib.Path("auto_creative.py")
          marker = "AFFILIATE_QUALITY_V5_HOOK"

          with tempfile.TemporaryDirectory() as folder:
              target = pathlib.Path(folder) / "auto_creative.py"
              original = source.read_bytes()
              target.write_bytes(original)

              if marker in original.decode("utf-8"):
                  # V5 is already integrated in build_bundle.
                  # The installer must refuse a different hook.
                  result = subprocess.run(
                      [
                          sys.executable,
                          "install_affiliate_quality_v5.py",
                          str(target),
                      ],
                      capture_output=True,
                      text=True,
                  )

                  if result.returncode == 0:
                      # Only an identical, already-installed
                      # hook may be accepted.
                      assert target.read_bytes() == original
                  else:
                      assert (
                          "manual review required"
                          in (result.stdout + result.stderr)
                      )

                  assert target.read_bytes() == original
                  print(
                      "Existing V5 integration preserved."
                  )
              else:
                  # Test installation only on a temporary file.
                  subprocess.run(
                      [
                          sys.executable,
                          "install_affiliate_quality_v5.py",
                          str(target),
                      ],
                      check=True,
                  )

                  updated = target.read_text(
                      encoding="utf-8"
                  )
                  assert marker in updated

                  backup = target.with_suffix(
                      ".py.v5.bak"
                  )
                  assert backup.exists()
                  assert backup.read_bytes() == original

                  # Running the installer again must not
                  # change the already-installed file.
                  subprocess.run(
                      [
                          sys.executable,
                          "install_affiliate_quality_v5.py",
                          str(target),
                      ],
                      check=True,
                  )

                  assert (
                      target.read_text(encoding="utf-8")
                      == updated
                  )

                  print(
                      "V5 installer safety test passed."
                  )
          PY

      - name: Verify V5 integration without API calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("auto_creative.py").read_text(
              encoding="utf-8"
          )
          tree = ast.parse(source)

          functions = [
              node
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "build_bundle"
          ]

          assert functions, (
              "build_bundle function is missing"
          )

          assert "AFFILIATE_QUALITY_V5_HOOK" in source, (
              "V5 quality hook is missing"
          )

          assert "review_bundle" in source, (
              "V5 review function is not referenced"
          )

          print("V5 integration check passed.")
          print("No Gemini API calls were made.")
          print("No WordPress requests were made.")
          PY

      - name: Final safety confirmation
        run: |
          echo "All V5 safety tests passed."
          echo "Quality improvement tests passed."
          echo "No production files were modified."
          echo "WordPress was not accessed."
          echo "Scheduled article generation was not executed."
