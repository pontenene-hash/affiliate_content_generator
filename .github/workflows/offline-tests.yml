name: Offline Regression Tests

on:
  push:
    branches: [feature-affiliate-v2-validation]
  pull_request:
    branches: [feature-affiliate-v2-validation]

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML

      - name: Compile application and test modules
        run: python -m compileall -q .

      - name: Run offline regression suite
        run: python -m pytest -q
